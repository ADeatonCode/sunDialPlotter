<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/sundial.css">
        <title>Sun Dial Plotter</title>
    </head>
    <body>
        
        <h1 id="title">Sundial Plotter</h1>
        <p id="about">This is a simple sundial plotter using HTML, CSS, and JavaScript. The sun's position is calculated using the Geolocation API and the canvas element to draw the sundial.</p>
        <form id="locationContainer">
            <form id="inputForm">
                <div class="location-row">
                    <label for="location">Location:</label>
                    <input type="text" id="location" name="location" value="Your Town">
                    <label for="lat">Latitude:</label>
                    <input type="number" id="lat" name="coordinates" step="any" value="36.1522">
                </div>
                <br>
                <div class="type-row">                        
                    <div class="type-col">
                        <p id="dialType"><b>Dial Type:</b></p>
                        <input type="radio" id="verticalDial" name="dialType"  value="v" checked>
                        <label for="verticalDial">Vertical Dial</label>
                        <br>
                        <input type="radio" id="horizontalDial" name="dialType" value="h">
                        <label for="horizontalDial">Horizontal Dial</label><br><br>
                        <br>
                        
                        <p id="dialFace"><b>Face Type:</b></p>
                        <input type="radio" id="frontView" Name="FaceType" value="Front" checked>
                        <label for="frontView">Front View</label>
                        <br>
                        <input type="radio" id="backView" name="FaceType" value="Back">
                        <label for="backView">Back View (see through)</label>
                    </div>
                    <label for="description">Description:</label>
                    <textarea rows = "10" columns = "20" id="description" name="description" placeholder = "describe the dial you are plotting"></textarea>
                </div>
                <br>
                <div class="specification-row">
                    <label for="alpha">Gnomon Distance:</label>
                    <input type="number" id="alpha" name="alpha" step="any" value="6.4568"><br><br>
        
                    <label for="beta">Gnomon length:</label>  
                    <input type="number" id="beta" name="beta" step="any" value="5"><br><br>
                    <label for="tau">tilt:</label>
                    <input type="number" id="tau" name="tau" step="any" value="0"><br><br>
        
                    <label for="omega">Dial direction:</label>
                    <input type="number" id="omega" name="omega" step="any" value="112.5"><br><br>
        
                    <label for="timeInterval">Time Interval:</label>
                    <input type="number" id="timeInterval" name="timeInterval" step="15" value="15"><br><br>
                </div>        
                <br>
                <div class="dialSize-row">
                    <label for="dialHeight">Dial Height:</label>
                    <input type="number" id="dialHeight" name="dialSize" step="1" value="28">
                
                    <label for="dialWidth">Dial Width:</label>
                    <input type="number" id="dialWidth" name="dialSize" step="1" value="12">
                    <br><br>
                </div>

                <div class="buttonContainer">
                    <button type="button" onclick="readValues()">Submit</button>
                </div>  
            </form>
        </div>
        <hr />
        <div id="results"></div>
        <hr />
        <table id="data-table" border="1">
            <thead>
                <tr>
                    <th>Dec/Time</th> <!-- Row header for Dec -->
                    <!-- Dynamic time headers will be added here -->
                </tr>
            </thead>
            <tbody id="body-row">
                <!-- Data rows will be dynamically added here -->
            </tbody>
        </table>
        <div id="downloadButtonContainer">    
            <button id="downloadButton">Download CSV</button>
        </div>
        <hr />
        <h2 id="dialPlotTitle">Dial Plot</h2>
        <div class="canvas-container">
            <canvas id="sundialCanvas" width="400" height="400"></canvas>
        </div>
        <script src="scripts/sundial.js"></script>
    </body>
</html>
